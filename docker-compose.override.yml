services:
  # Zookeper
  zookeeper:
    networks:
        - app_network
  # Kafka
  kafka: 
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "29092"]   
      interval: 10s
      retries: 15
      timeout: 5s

  # Genera topics con particiones
  kafka-init:
    image: confluentinc/cp-enterprise-kafka:5.5.3
    networks:
      - app_network
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Esperando que Kafka esté listo...' &&
      cub kafka-ready -b kafka:29092 1 40 &&
      kafka-topics --create --topic transaction_created --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 || echo 'Topic transaction_created ya existe' &&
      kafka-topics --create --topic transaction_status_updated --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 || echo 'Topic transaction_status_updated ya existe'
      "

  # Microservicio de Transacciones
  transaction-service:
    build:
      context: ./transactions-service
      dockerfile: Dockerfile
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && node ./dist/index.js"]
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - POSTGRES_DB=yape_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - KAFKA_BROKER=kafka:29092
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/yape_db
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app_network

  # Microservicio de Anti-Fraude
  anti-fraud-service:
    build:
      context: ./anti-fraud-service
      dockerfile: Dockerfile
    command: ["node", "./dist/index.js"]
    ports:
      - "3002:3002"
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app_network

  # DB con volumenes para persistencia de Datos
  postgres:
    environment:
      - POSTGRES_DB=yape_db
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

volumes:
  postgres_data: 

networks:
  app_network:
    driver: bridge