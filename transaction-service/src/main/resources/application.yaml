spring:
  application:
    name: transaction-service

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:secret1234}

  data:
    neo4j:
      repositories:
        type: reactive   # activa ReactiveNeo4jRepository

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transaction-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"

  graphql:
    schema:
      locations: classpath:graphql/**/   # valor por defecto, no necesitas cambiarlo
      file-extensions: .graphqls, .gqls  # valor por defecto
    websocket:
      path: /graphql-ws

kafka:
  topics:
    transactions: transactions
    fraud-results: fraud-results

server:
  port: 8080