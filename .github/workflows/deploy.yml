name: CI/CD Pipeline 
on:
  push:
    branches:
      - feat/code-challenge
jobs:
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Cache Node.Js Modules For Ms-Transaction
      uses: actions/cache@v3
      with:
          path: ./ms-transaction/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
  
    - name: Cache Node.Js Modules For Ms-Fraude
      uses: actions/cache@v3
      with:
          path: ./ms-antifraud/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Cache Node.Js Modules For Ms-Users
      uses: actions/cache@v3
      with:
          path: ./ms-users/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Install Dependencies Ms-Transaction
      working-directory: ./ms-transaction
      run: npm install

    - name: Install Dependencies For Ms-Fraude
      working-directory: ./ms-antifraud
      run: npm install

    - name: Install Dependencies For Ms-Users
      working-directory: ./ms-users
      run: npm install

  run-lints:
    name: Run Lint
    runs-on: ubuntu-latest
    needs: install-dependencies

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Restore Cache Node.Js Modules For Ms-Transaction
      uses: actions/cache@v3
      with:
        path: ./ms-transaction/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Restore Cache Node.Js Modules For Ms-Fraude
      uses: actions/cache@v3
      with:
        path: ./ms-antifraud/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Restore Cache Node.Js Modules For Ms-User
      uses: actions/cache@v3
      with:
        path: ./ms-users/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: List Installed Packages Ms-Transaction
      working-directory: ./ms-transaction
      run: npm list

    - name: List Installed Packages Ms-Fraude
      working-directory: ./ms-antifraud
      run: npm list

    - name: Run Lint For Ms-Transaction
      working-directory: ./ms-transaction
      run: npm run lint

    - name: Run Lint For Ms-Fraude
      working-directory: ./ms-antifraud
      run: npm run lint

    - name: Run Lint For Ms-Users
      working-directory: ./ms-users
      run: npm run lint

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: run-lints
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Restore Cache Node.Js Modules For Ms-Transaction
      uses: actions/cache@v3
      with:
        path: ./ms-transaction/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Restore Cache Node.Js Modules For Ms-Fraude
      uses: actions/cache@v3
      with:
        path: ./ms-antifraud/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    
    - name: Restore Cache Node.Js Modules For Ms-User
      uses: actions/cache@v3
      with:
        path: ./ms-users/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Run Tests For Ms-Transaction
      working-directory: ./ms-transaction
      run: npm run test

    - name: Run Tests For Ms-Fraude
      working-directory: ./ms-antifraud
      run: npm run test

    - name: Run Tests For Ms-User
      working-directory: ./ms-users
      run: npm run test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.ref == 'refs/heads/feat/code-challenge' 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log In to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build And Push Docker Image For Ms-Transaction
      run: |
        docker build -t rafamandevops/ms-transaction ./ms-transaction
        docker push rafamandevops/ms-transaction

    - name: Build And Push Docker Image For Ms-Fraude
      run: |
        docker build -t rafamandevops/ms-antifraud ./ms-antifraud
        docker push rafamandevops/ms-antifraud

    - name: Build And Push Docker Image For Ms-User
      run: |
          docker build -t rafamandevops/ms-users ./ms-users
          docker push rafamandevops/ms-antifraud