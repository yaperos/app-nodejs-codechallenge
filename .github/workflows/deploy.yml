name: CI Pipeline 

on:
  push:
    branches:
      - feat/code-challenge
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set Up NestJS
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies For Ms-Transaction
      working-directory: ./ms-transaction
      run: npm install

    - name: Run Test For Ms-Transaction
      working-directory: ./ms-transaction
      run: npm run test

