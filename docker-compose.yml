services:

  postgres:
    image: postgres:15
    container_name: transactions-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions
    ports:
      - "5432:5432"
    networks:
      - transactions-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - transactions-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      
      # 👇 IMPORTANTE
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - transactions-net

  redis:
    image: redis:7
    container_name: transactions-redis
    ports:
      - "6379:6379"
    networks:
      - transactions-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - transactions-net

  productor-service:
    build: ./yape-productor
    container_name: productor-service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transactions
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - transactions-net

  antifraude-service:
    build: ./yape-anti-fraude
    container_name: antifraude-service
    depends_on:
      - kafka
      - redis
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    networks:
      - transactions-net

networks:
  transactions-net:
    driver: bridge