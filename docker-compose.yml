version: "3.7"
services:
  trx-api:
    build:
      context: ./trx-microservice
    container_name: trx-api
    ports:
      - "3001:3000"
    env_file:
      - ./trx-microservice/.env
    volumes:
      - ./trx-microservice:/app
      - trx_node_modules:/app/node_modules  
    depends_on:
      - postgres
      - kafka
      - anti-fraud-api
    restart: unless-stopped

  anti-fraud-api:
    build:
      context: ./anti-fraud-microservice  
    container_name: anti-fraud-api
    ports:
      - "3002:3000"
    env_file:
      - ./anti-fraud-microservice/.env
    volumes:
      - ./anti-fraud-microservice:/app
      - antifraud_node_modules:/app/node_modules
    depends_on:
      - postgres
      - kafka
    restart: unless-stopped

  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=yape
  zookeeper:
    image: confluentinc/cp-zookeeper:5.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-enterprise-kafka:5.5.3
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9991
    ports:
      - 9092:9092
volumes:
  trx_node_modules: {}
  antifraud_node_modules: {}