name:
  yape-services
services:
  redis:
    container_name: "yape-redis"
    image: redis:8-alpine
    restart: always
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    volumes:
      - redis:/root/redis

  postgres:
    container_name: yape-db
    image: postgres:16-alpine
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA= /data/postgres
      - TZ= America/Lima
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgresql:/data/postgres
      - postgresql_lib:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
  zookeeper:
    container_name: yape-zookeeper
    platform: linux/amd64
    image: confluentinc/cp-zookeeper:5.5.3
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
  kafka:
    container_name: yape-kafka
    platform: linux/amd64
    image: confluentinc/cp-enterprise-kafka:5.5.3
    restart: always
    depends_on: [zookeeper]
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9991
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka-ui:
    container_name: yape-kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: always
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=Local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - DYNAMIC_CONFIG_ENABLED=true
    ports:
      - "8080:8080"

  bff:
    container_name: yape-svc-bff
    build:
      context: ./yape-svc-bff
      dockerfile: ../Dockerfile.server
    volumes:
      - ./yape-svc-bff:/usr/app
      - bff_modules:/usr/app/node_modules
    restart: unless-stopped
    ports:
      - 6001:3000
    env_file: ./yape-svc-bff/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ms-transactions

  ms-anti-fraud:
    container_name: yape-ms-anti-fraud
    build:
      context: ./yape-ms-anti-fraud
      dockerfile: ../Dockerfile.server
    volumes:
      - ./yape-ms-anti-fraud:/usr/app
      - ms-anti-fraud_modules:/usr/app/node_modules
    restart: unless-stopped
    ports:
      - 6003:3000
    env_file: ./yape-ms-anti-fraud/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
      postgres: 
        condition: service_healthy
  

  ms-transactions:
    container_name: yape-ms-transactions
    build:
      context: ./yape-ms-transactions
      dockerfile: ../Dockerfile.server
    volumes:
      - ./yape-ms-transactions:/usr/app
      - ms-transactions_modules:/usr/app/node_modules
    restart: unless-stopped
    ports:
      - 6002:3000
    env_file: ./yape-ms-transactions/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
      postgres: 
        condition: service_healthy
  
volumes:
  postgresql:
  postgresql_lib:
  postgresql_data:
  redis:
  bff_modules:
  ms-anti-fraud_modules:
  ms-transactions_modules:
