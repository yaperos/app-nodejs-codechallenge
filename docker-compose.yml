version: "3.7"
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - backend

  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol (driver)
    environment:
      NEO4J_AUTH: neo4j/secret1234
      NEO4J_PLUGINS: '["apoc"]'                         # procedimientos APOC útiles para merge/upsert
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/init:/docker-entrypoint-initdb.d         # scripts Cypher de inicialización
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "secret1234", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - backend

  transaction-service:
    build: ./transaction-service
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: secret1234
    restart: on-failure
    networks:
      - backend

  anti-fraud-service:
    build: ./anti-fraud-service
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: on-failure
    networks:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  backend:
    driver: bridge