version: "3.8"
services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: yape-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yape_challenge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Zookeeper para Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:5.5.3
    container_name: yape-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-enterprise-kafka:5.5.3
    container_name: yape-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9991
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Aplicación Principal
  transaction-api:
    build: .
    container_name: yape-transaction-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: yape_challenge
      KAFKA_BROKER: kafka:29092
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    depends_on:
      - postgres
      - kafka

  # Simulador Anti-Fraude
  anti-fraud-simulator:
    build: ./anti-fraud-simulator
    container_name: yape-anti-fraud
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:29092
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    depends_on:
      - kafka

volumes:
  postgres_data:
